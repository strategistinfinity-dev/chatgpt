<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Login Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #111827;
        --card: rgba(15, 23, 42, 0.6);
        --line: rgba(148, 163, 184, 0.2);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #22d3ee;
        --accent-2: #8b5cf6;
        --ok: #34d399;
        --error: #fb7185;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        min-height: 100vh;
        color: var(--text);
        background: radial-gradient(circle at 10% 15%, #1d4ed8 0%, transparent 25%),
          radial-gradient(circle at 90% 20%, #7c3aed 0%, transparent 28%),
          radial-gradient(circle at 50% 85%, #0891b2 0%, transparent 30%),
          linear-gradient(145deg, var(--bg-1), var(--bg-2));
        overflow: hidden;
      }

      .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.25;
        background-image: linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, #000 35%, transparent 85%);
        animation: drift 24s linear infinite;
      }

      .orbs {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
      }

      .orb {
        position: absolute;
        filter: blur(5px);
        border-radius: 999px;
        opacity: 0.55;
        animation: float 16s ease-in-out infinite;
      }

      .orb.one {
        width: 250px;
        height: 250px;
        left: -4%;
        top: 8%;
        background: linear-gradient(135deg, #22d3ee, #0ea5e9);
      }

      .orb.two {
        width: 320px;
        height: 320px;
        right: -8%;
        top: 50%;
        animation-delay: -4s;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
      }

      .orb.three {
        width: 220px;
        height: 220px;
        left: 40%;
        bottom: -8%;
        animation-delay: -7s;
        background: linear-gradient(135deg, #14b8a6, #22d3ee);
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
        z-index: 1;
      }

      .panel {
        width: min(460px, 100%);
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: linear-gradient(160deg, rgba(15, 23, 42, 0.76), rgba(15, 23, 42, 0.45));
        backdrop-filter: blur(14px);
        box-shadow: 0 40px 60px rgba(2, 6, 23, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        animation: cardIn 800ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .badge {
        width: fit-content;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #bae6fd;
        border: 1px solid rgba(34, 211, 238, 0.35);
        background: rgba(6, 182, 212, 0.15);
        margin-bottom: 16px;
        animation: fadeSlideUp 700ms ease 220ms both;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 2.6vw, 2rem);
        animation: fadeSlideUp 700ms ease 340ms both;
      }

      p {
        margin: 12px 0 24px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        animation: fadeSlideUp 700ms ease 460ms both;
      }

      form {
        display: grid;
        gap: 16px;
      }

      .input-wrap {
        position: relative;
        animation: fadeSlideUp 700ms ease both;
      }

      .input-wrap:nth-child(1) {
        animation-delay: 580ms;
      }

      .input-wrap:nth-child(2) {
        animation-delay: 700ms;
      }

      .input-wrap input {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.45);
        color: var(--text);
        border-radius: 14px;
        padding: 15px 15px 15px 42px;
        font-size: 0.96rem;
        outline: none;
        transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      }

      .input-wrap input:focus {
        border-color: rgba(34, 211, 238, 0.9);
        box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.15);
        transform: translateY(-1px);
      }

      .input-wrap span {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #67e8f9;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: -2px;
        margin-bottom: 4px;
        animation: fadeSlideUp 700ms ease 820ms both;
      }

      .checkbox {
        display: inline-flex;
        gap: 8px;
        font-size: 0.87rem;
        color: #cbd5e1;
      }

      .row a {
        color: #93c5fd;
        font-size: 0.87rem;
        text-decoration: none;
      }

      button {
        border: none;
        cursor: pointer;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: #082f49;
        background: linear-gradient(135deg, #67e8f9, #22d3ee 45%, #a78bfa);
        position: relative;
        overflow: hidden;
        animation: fadeSlideUp 700ms ease 940ms both;
        transition: transform 150ms ease, box-shadow 180ms ease;
      }

      button:hover {
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 14px 24px rgba(6, 182, 212, 0.3);
      }

      button:active {
        transform: translateY(0) scale(0.995);
      }

      button::after {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 90%;
        height: 100%;
        transform: skewX(-25deg);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
        animation: sheen 2.8s ease-in-out infinite;
      }

      .foot {
        margin-top: 20px;
        text-align: center;
        color: var(--muted);
        font-size: 0.88rem;
        animation: fadeSlideUp 700ms ease 1060ms both;
      }

      .foot a {
        color: #a5f3fc;
      }

      .msg {
        font-size: 0.88rem;
        min-height: 1.2rem;
        color: var(--ok);
        margin-top: 8px;
        text-align: center;
        transition: opacity 200ms ease;
        opacity: 0;
      }

      .msg.show {
        opacity: 1;
      }

      .msg.error {
        color: var(--error);
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: perspective(900px) rotateX(14deg) translateY(28px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: perspective(900px) rotateX(0deg) translateY(0) scale(1);
        }
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes drift {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(-42px, -42px, 0);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-26px);
        }
      }

      @keyframes sheen {
        0% {
          left: -120%;
        }
        45%,
        100% {
          left: 130%;
        }
      }

      @media (max-width: 530px) {
        .panel {
          padding: 26px 20px;
          border-radius: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid" aria-hidden="true"></div>
    <div class="orbs" aria-hidden="true">
      <div class="orb one"></div>
      <div class="orb two"></div>
      <div class="orb three"></div>
    </div>

    <main class="stage">
      <section class="panel">
        <div class="badge">Secure Portal</div>
        <h1>Welcome back 👋</h1>
        <p>Sign in to continue. Enjoy smooth motion effects, glow interactions, and glassmorphism UI.</p>

        <form id="loginForm" novalidate>
          <label class="input-wrap">
            <span>✉️</span>
            <input type="email" id="email" placeholder="Email address" autocomplete="email" required />
          </label>

          <label class="input-wrap">
            <span>🔒</span>
            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
          </label>

          <div class="row">
            <label class="checkbox">
              <input type="checkbox" />
              Remember me
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit">Sign in</button>
          <div class="msg" id="status"></div>
        </form>

        <div class="foot">No account? <a href="#">Create one</a></div>
      </section>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const statusEl = document.getElementById("status");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        statusEl.classList.remove("show", "error");

        if (!email || !password) {
          statusEl.textContent = "Please enter both email and password.";
          statusEl.classList.add("show", "error");
          return;
        }

        statusEl.textContent = "Authentication animation complete ✅";
        statusEl.classList.add("show");
      });
    </script>
  </body>
</html>
