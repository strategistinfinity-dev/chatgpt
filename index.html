<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Login Portal</title>
    <style>
      :root {
        --bg: #05070f;
        --card: rgba(13, 19, 36, 0.78);
        --stroke: rgba(143, 180, 255, 0.32);
        --text: #eef3ff;
        --muted: #b8c9ea;
        --accent: #5f89ff;
        --accent-2: #69e8ff;
        --danger: #ff6a8e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 15% 20%, #15213f 0%, transparent 38%),
          radial-gradient(circle at 80% 10%, #162d4f 0%, transparent 32%),
          radial-gradient(circle at 70% 80%, #2b1955 0%, transparent 35%), var(--bg);
        display: grid;
        place-items: center;
      }

      .scene {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .glow {
        position: absolute;
        width: 45vmax;
        height: 45vmax;
        border-radius: 50%;
        filter: blur(38px);
        opacity: 0.32;
        animation: drift 12s ease-in-out infinite alternate;
      }

      .glow.one {
        top: -18vmax;
        left: -10vmax;
        background: #4a81ff;
      }

      .glow.two {
        bottom: -16vmax;
        right: -12vmax;
        background: #6e4eff;
        animation-delay: -3s;
      }

      .glow.three {
        top: 45%;
        left: 48%;
        background: #27d9ff;
        width: 30vmax;
        height: 30vmax;
        animation-delay: -6s;
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 22% 34%, rgba(255, 255, 255, 0.28) 1px, transparent 1px),
          radial-gradient(circle at 68% 20%, rgba(255, 255, 255, 0.25) 1px, transparent 1px),
          radial-gradient(circle at 45% 70%, rgba(255, 255, 255, 0.24) 1px, transparent 1px),
          radial-gradient(circle at 83% 55%, rgba(255, 255, 255, 0.22) 1px, transparent 1px),
          radial-gradient(circle at 14% 78%, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
        background-size: 260px 260px;
        animation: twinkle 8s linear infinite;
      }

      .login-shell {
        width: min(420px, calc(100% - 2rem));
        border-radius: 24px;
        border: 1px solid var(--stroke);
        background: var(--card);
        backdrop-filter: blur(12px);
        box-shadow: 0 30px 65px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
        animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .login-shell::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 35%, rgba(255, 255, 255, 0.18) 50%, transparent 63%);
        transform: translateX(-100%);
        animation: sweep 5s ease-in-out infinite;
      }

      .content {
        padding: 2rem;
        position: relative;
        z-index: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.65rem, 5vw, 2rem);
      }

      p {
        margin: 0.55rem 0 1.6rem;
        color: var(--muted);
      }

      .field {
        margin-bottom: 0.95rem;
      }

      label {
        display: inline-block;
        margin-bottom: 0.42rem;
        color: #dae8ff;
        font-size: 0.92rem;
      }

      input {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(157, 188, 255, 0.35);
        background: rgba(7, 12, 25, 0.72);
        color: var(--text);
        padding: 0.78rem 0.86rem;
        outline: none;
        transition: border-color 0.28s, box-shadow 0.28s, transform 0.28s;
      }

      input:focus {
        border-color: var(--accent-2);
        transform: translateY(-1px);
        box-shadow: 0 0 0 4px rgba(76, 194, 255, 0.16), 0 9px 24px rgba(44, 121, 255, 0.22);
      }

      .actions {
        margin-top: 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
      }

      .remember {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .remember input {
        width: auto;
        accent-color: var(--accent);
      }

      button {
        width: 100%;
        margin-top: 1rem;
        border: 0;
        border-radius: 12px;
        color: #ffffff;
        font-weight: 700;
        letter-spacing: 0.02em;
        padding: 0.88rem 1rem;
        cursor: pointer;
        background: linear-gradient(120deg, #4e82ff, #5e5cff, #3ec8ff);
        background-size: 220% 220%;
        animation: pulse 2.8s ease-in-out infinite;
        box-shadow: 0 14px 30px rgba(45, 103, 255, 0.35);
      }

      button:hover {
        filter: brightness(1.06);
      }

      .footer {
        text-align: center;
        margin-top: 0.95rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .footer a {
        color: #8fc7ff;
      }

      .status {
        min-height: 1.3rem;
        font-size: 0.85rem;
        color: var(--danger);
        margin-top: 0.5rem;
      }

      @keyframes drift {
        from {
          transform: translateY(-12px) translateX(-8px) scale(0.94);
        }
        to {
          transform: translateY(16px) translateX(14px) scale(1.08);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(28px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes sweep {
        0%,
        35% {
          transform: translateX(-120%);
        }
        55% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(120%);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          background-position: 0% 40%;
        }
        50% {
          background-position: 100% 60%;
        }
      }

      @media (max-width: 480px) {
        .content {
          padding: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="glow one"></div>
      <div class="glow two"></div>
      <div class="glow three"></div>
      <div class="stars"></div>
    </div>

    <main class="login-shell" role="main">
      <section class="content">
        <h1>Welcome Back</h1>
        <p>Log in to continue into your dashboard.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          </div>

          <div class="actions">
            <label class="remember" for="rememberMe">
              <input id="rememberMe" type="checkbox" />
              Remember me
            </label>
            <a href="#" aria-label="Forgot password">Forgot password?</a>
          </div>

          <button type="submit">Sign In</button>
          <div class="status" id="statusMessage" aria-live="polite"></div>
        </form>

        <div class="footer">No account? <a href="#">Create one</a></div>
      </section>
    </main>

    <script>
      const form = document.getElementById('loginForm');
      const statusMessage = document.getElementById('statusMessage');

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        if (!form.checkValidity()) {
          statusMessage.textContent = 'Please enter a valid email and password.';
          return;
        }

        statusMessage.style.color = '#82ffc3';
        statusMessage.textContent = 'Success! Redirecting...';
      });
    </script>
  </body>
</html>
